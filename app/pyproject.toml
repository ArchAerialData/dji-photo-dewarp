[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-photo-dewarp"
version = "1.0.0"
description = "Internal DJI JPEG dewarping with a native batch GUI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "Pillow>=11,<13",
  "piexif>=1.1.3,<2",
  "PySide6>=6.10,<7",
]

[project.scripts]
dewarp = "dewarp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
